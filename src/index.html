<style>
    body { margin: 0; height: 100vh; background: linear-gradient(#0bf 80vh, green 0); }
    div { position: fixed; left: .5vw; top: 1vh; width: 10vw; height: 12.5vh; padding: .5vw; background: bisque; }
    div+div { top: 17.5vh; width: 15vw; height: 20vh; }
    h1 { font-size: 1vw; }
    canvas { position: fixed; }
</style>
<div>
    <h1>Projectile Motion</h1>
    <p> Objective: hit the target!</p>
    <button id="f">&#x1F4A3; Fire!</button>
</div>
<div>
    <h1>Customisers</h1>
    <p style="margin-top:-.5vw">Customise how the ball is fired.</p>
    <input type="range" id="s" oninput='a.value=value+" m/s"'><output id="a">50 m/s</output>
    <input type="range" id="g" value="9" oninput='b.value=value+"m/s^2"'><output id="b">9m/s^2</output>
</div>
<canvas id="p" style="pointer-events:none"></canvas>
<canvas id="c" height="100" style="left:5vw;top:65vh;height:20vh"></canvas>
<canvas id="t" width="200" height="150" style="right:5vw;top:66.5vh;height:30vh"></canvas>
<script>
    const ballCtx = p.getContext("2d"),
    cannonCtx = c.getContext("2d"),
    targetCtx = t.getContext("2d");

    let angle = .44, dragging, bx = -9, by = -9, vx = 0, vy = 0, gravity = 0, last = 0;

    const paint = (ctx, colour) => { ctx.fillStyle = colour; ctx.fill(); ctx.stroke(); };

    p.height = innerHeight;

    const draw = () => {
        c.width = 100;
        cannonCtx.save();
        cannonCtx.translate(32, 90);
        cannonCtx.rotate(angle);
        cannonCtx.beginPath();
        cannonCtx.moveTo(-15, -60);
        cannonCtx.quadraticCurveTo(-25, 0, -15, 0);
        cannonCtx.lineTo(15, 0);
        cannonCtx.quadraticCurveTo(25, -2, 15, -60);
        paint(cannonCtx, "white");
        cannonCtx.beginPath();
        cannonCtx.ellipse(0, -60, 15, 3, 0, 0, 7);
        paint(cannonCtx, "silver");
        cannonCtx.restore();
        cannonCtx.beginPath();
        cannonCtx.arc(32, 100, 30, 3.14, 0);
        paint(cannonCtx, "red");
    }

    const aim = (e) => {
        const r = c.getBoundingClientRect(), k = 100 / r.width;
        angle = Math.max(0, Math.min(1.4, Math.atan2((e.clientY - r.top) * k - 90, (e.clientX - r.left) * k - 32) + 1.57));
        draw();
    }

    c.onmousedown = (e) => { dragging = 1; aim(e); };
    onmousemove = (e) => { dragging && aim(e); };
    onmouseup = (e) => { dragging = 0 };

    f.onclick = () => {
        const r = c.getBoundingClientRect(), k = r.height / 100,
        sin = Math.sin(angle), cos = Math.cos(angle);

        bx = r.left + k * (32 + sin * 60);
        by = r.top + k * (90 - cos * 60);
        vx = sin * s.value;
        vy = -cos * s.value;
        gravity = +g.value;
    }

    const loop = (now) => {
        const k = (now - last) / 100;
        last = now;
        p.width = innerWidth;
        bx += vx * k;
        vy += gravity * k;
        by += vy * k;
        ballCtx.beginPath();
        ballCtx.arc(bx, by, 8, 0, 7);
        paint(ballCtx);
        requestAnimationFrame(loop);
    };

    for (let i = 3; i; i--) {
        targetCtx.beginPath();
        targetCtx.ellipse(125, 80, 25 * i, 4 * i, 0, 0, 7);
        paint(targetCtx, i % 2 ? "red" : "white");
    }

    draw();
    loop(0);
</script>
